<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanga Promotions | Custom Printed Promotional Merchandise Australia</title>
    <meta
      name="description"
      content="Custom printed promotional merchandise for Australian businesses. Stubby coolers, drinkware, towels, caps, apparel and more, branded with your logo. Request a quote."
    />
    <meta name="theme-color" content="#15130F" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- TODO: set to the live subdomain once confirmed -->
    <link rel="canonical" href="https://promotions.example.com.au/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kanga Promotions" />
    <meta property="og:title" content="Kanga Promotions | Your Brand. On Everything." />
    <meta
      property="og:description"
      content="Custom printed promotional merchandise for Australian businesses. Put your logo on products people actually use."
    />
    <meta property="og:url" content="https://promotions.example.com.au/" />
    <meta property="og:locale" content="en_AU" />
    <!-- TODO: add a 1200x630 share image at /og-image.jpg, then uncomment:
    <meta property="og:image" content="https://promotions.example.com.au/og-image.jpg" />
    <meta name="twitter:image" content="https://promotions.example.com.au/og-image.jpg" />
    -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Kanga Promotions | Your Brand. On Everything." />
    <meta
      name="twitter:description"
      content="Custom printed promotional merchandise for Australian businesses."
    />
  </head>
  <body>
    <!--
      Static copy of the quote form so Netlify Forms can detect it at deploy time.
      The visible React form posts to the same form name. Keep field names in sync
      with src/components/QuoteForm.tsx.
    -->
    <form name="quote" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
      <input type="hidden" name="form-name" value="quote" />
      <input name="bot-field" />
      <input name="fullName" />
      <input name="company" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="products" />
      <input name="quantity" />
      <textarea name="details"></textarea>
      <input name="artwork" type="file" />
    </form>
    <div id="root"></div>
    <noscript>
      Kanga Promotions: custom printed promotional merchandise for Australian businesses.
      Please enable JavaScript to request a quote.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
